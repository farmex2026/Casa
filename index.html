<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presupuestos · Marmolería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF0F1; --paper:#FFFFFF; --ink:#1A2230; --muted:#5E6875; --line:#D5DAE0;
  --navy:#1B3556; --navy-ink:#FFFFFF; --slab:#2A2F36; --warn:#A33A1F; --warn-bg:#FBEAE4;
  --ok:#1F7A4A; --wa:#1F8F4E; --field:#F7F8F9;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15191F; --paper:#1E242C; --ink:#E8ECF1; --muted:#9AA4B1; --line:#323B46;
    --navy:#7FA6D6; --navy-ink:#0F1823; --slab:#0E1116; --warn:#F09A7E; --warn-bg:#3A2019;
    --ok:#6FD19B; --wa:#3DBE72; --field:#252C35;
  }
}
:root[data-theme="dark"]{
  --bg:#15191F; --paper:#1E242C; --ink:#E8ECF1; --muted:#9AA4B1; --line:#323B46;
  --navy:#7FA6D6; --navy-ink:#0F1823; --slab:#0E1116; --warn:#F09A7E; --warn-bg:#3A2019;
  --ok:#6FD19B; --wa:#3DBE72; --field:#252C35;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

header.top{background:var(--slab);color:#F2F4F6;padding:14px 16px 0}
.top-inner{max-width:980px;margin:0 auto}
.brand{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:#A9B2BD;letter-spacing:0;margin-top:4px}
nav.tabs{display:flex;gap:4px;margin-top:14px}
nav.tabs button{background:none;border:0;color:#A9B2BD;padding:10px 14px;border-radius:8px 8px 0 0;font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink)}

main{max-width:980px;margin:0 auto;padding:18px 14px 140px}
section[hidden]{display:none}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:0 0 4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}

/* carga de hojas */
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;background:var(--field)}
.drop.over{border-color:var(--navy)}
.drop label{color:var(--navy);font-weight:600;text-decoration:underline;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.thumbs figure{margin:0;position:relative;width:72px;height:96px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.status{font-size:14px;color:var(--muted)}
.status.err{color:var(--warn)}

.btn{border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--navy);padding-left:4px;padding-right:4px}
.btn:disabled{opacity:.5;cursor:default}

/* datos */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px}
.f span{font-size:13px;color:var(--muted)}
input,textarea,select{background:var(--field);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.f.wide{grid-column:1/-1}

/* grupos */
.grupo{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:10px;padding:14px;margin-bottom:12px}
.g-head{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.g-head .g-nombre{font-weight:600}
.cols,.it{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) 64px 100px 34px;gap:6px;align-items:center}
.cols{font-size:12px;color:var(--muted);margin:12px 0 4px;padding:0 2px}
.it{margin-bottom:6px}
.it input[data-f="cantidad"],.it input[data-f="importe"]{text-align:right}
.x{width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:20px;border-radius:6px}
.x:hover{background:var(--field);color:var(--warn)}
.g-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.sub{font-family:var(--cond);font-weight:700;font-size:20px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:7px;padding:8px 10px;font-size:14px;margin:10px 0 0}
.warn[hidden]{display:none}
.add-g{width:100%;padding:12px;border:2px dashed var(--line);background:none;border-radius:10px;color:var(--navy);font-weight:600;margin-bottom:14px}

@media (max-width:640px){
  .g-head{grid-template-columns:1fr auto}
  .g-head .g-mat{grid-column:1/2;grid-row:2}
  .cols{display:none}
  .it{grid-template-columns:1fr 60px 92px 34px;grid-template-areas:"det det det det" "prod cant imp x";padding:8px 0;border-top:1px solid var(--line);margin:0}
  .it [data-f="detalle"]{grid-area:det}.it [data-f="producto"]{grid-area:prod}
  .it [data-f="cantidad"]{grid-area:cant}.it [data-f="importe"]{grid-area:imp}.it .x{grid-area:x}
}

/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--slab);color:#F2F4F6;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-inner{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.total{margin-right:auto;line-height:1}
.total small{display:block;font-size:12px;color:#A9B2BD;margin-bottom:3px}
.total b{font-family:var(--cond);font-size:30px;font-weight:700}
.bar .btn{border-color:#46505C;background:#343B44;color:#F2F4F6}
.bar .btn.primary{background:#F2F4F6;color:#1A2230;border-color:#F2F4F6}
.bar .btn.wa{background:var(--wa);border-color:var(--wa)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:90vw}
.toast[hidden]{display:none}

/* guardados */
.lista{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .num{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--navy)}
.card .t{font-weight:600}
.card .m{font-size:13px;color:var(--muted)}
.card .amt{font-family:var(--cond);font-weight:700;font-size:20px;text-align:right}
.card .acts{grid-column:1/-1;display:flex;gap:4px;justify-content:flex-end}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.logo-prev{max-width:180px;max-height:70px;display:block;margin:6px 0;background:#fff;border-radius:4px}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand" id="brandName">Presupuestos<small id="brandSub">Marmolería</small></div>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="editor">Presupuesto</button>
      <button role="tab" aria-selected="false" data-view="lista">Guardados</button>
      <button role="tab" aria-selected="false" data-view="ajustes">Ajustes</button>
    </nav>
  </div>
</header>

<main>
  <!-- EDITOR -->
  <section id="v-editor">
    <div class="panel" id="aiPanel">
      <h2>¿Tenés las hojas escritas?</h2>
      <p class="hint">Para leer las fotos usá la versión en Claude: arma el presupuesto solo y también descarga el PDF y lo manda por WhatsApp.</p>
      <a class="btn primary" href="https://claude.ai/artifact/FJP76gi3KQMiXZvX6vex5r" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Abrir lector de hojas</a>
    </div>

    <div class="panel">
      <div class="grid">
        <label class="f"><span>N° presupuesto</span><input id="m-numero" type="number" inputmode="numeric"></label>
        <label class="f"><span>Fecha</span><input id="m-fecha" type="date"></label>
        <label class="f"><span>Moneda</span><select id="m-moneda"><option value="US$">Dólares (US$)</option><option value="$">Pesos ($)</option></select></label>
        <label class="f wide"><span>Trabajo</span><input id="m-trabajo" placeholder="Ej. Baño mujer, Cocina, Vanitory"></label>
        <label class="f"><span>Cliente</span><input id="m-cliente" placeholder="Nombre del cliente"></label>
        <label class="f"><span>WhatsApp del cliente</span><input id="m-telefono" type="tel" inputmode="tel" placeholder="11 2345 6789"></label>
      </div>
    </div>

    <div id="grupos"></div>
    <button class="add-g" id="addG">+ Agregar grupo (pieza o sector)</button>

    <div class="panel">
      <label class="f"><span>Nota al pie del presupuesto</span><textarea id="m-nota" rows="2"></textarea></label>
    </div>
  </section>

  <!-- GUARDADOS -->
  <section id="v-lista" hidden>
    <div class="row-actions" style="margin:0 0 12px">
      <input id="buscar" placeholder="Buscar por cliente, trabajo o número" style="flex:1">
    </div>
    <div class="lista" id="lista"></div>
  </section>

  <!-- AJUSTES -->
  <section id="v-ajustes" hidden>
    <div class="panel">
      <h2>Datos de la marmolería</h2>
      <p class="hint">Así sale el encabezado y el pie de cada PDF.</p>
      <div class="grid">
        <label class="f"><span>Nombre (si no hay logo)</span><input id="c-empresa"></label>
        <label class="f"><span>Rubro (barra azul)</span><input id="c-rubro"></label>
        <label class="f"><span>Teléfono</span><input id="c-telefono"></label>
        <label class="f"><span>Próximo N° de presupuesto</span><input id="c-proximo" type="number"></label>
        <label class="f wide"><span>Frase del encabezado</span><textarea id="c-lema" rows="2"></textarea></label>
        <label class="f wide"><span>Texto de la columna izquierda (la primera línea sale en negrita)</span><textarea id="c-descripcion" rows="6"></textarea></label>
        <label class="f wide"><span>Franja gris del pie</span><input id="c-pie"></label>
        <label class="f wide"><span>Nota al pie por defecto</span><input id="c-nota"></label>
        <div class="f wide"><span>Logo</span>
          <img id="logoPrev" class="logo-prev" alt="Logo actual" hidden>
          <div class="row-actions" style="margin-top:4px">
            <label class="btn" for="c-logo">Subir logo</label><input type="file" id="c-logo" accept="image/png,image/jpeg,image/webp" hidden>
            <button class="btn ghost" id="quitarLogo" hidden>Quitar logo</button>
          </div>
        </div>
      </div>
      <div class="row-actions"><button class="btn primary" id="guardarCfg">Guardar ajustes</button><span class="status" id="cfgStatus"></span></div>
    </div>
  </section>
</main>

<div class="bar" id="bar">
  <div class="bar-inner">
    <div class="total"><small>Total</small><b id="total">US$ 0</b></div>
    <button class="btn" id="nuevo">Nuevo</button>
    <button class="btn" id="guardar">Guardar</button>
    <button class="btn primary" id="pdf">Descargar PDF</button>
    <button class="btn wa" id="wa">WhatsApp</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const fmt = n => Number(n || 0).toLocaleString("es-AR", { maximumFractionDigits: 2 });
const pad = n => String(n || 0).padStart(6, "0");

function toast(msg, ms = 3200) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }

let cfg = { ...CFG_DEF }, logo = LOGO_DEF;

/* ---------- almacenamiento: base de la app si está, si no el navegador ---------- */
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
let db = null, sample = null, downloads = null;
const store = {
  async getCfg() {
    if (db) { try { const s = await db.doc("config/empresa").get(); if (s.exists) return s.data(); } catch {} }
    return LS.get("pm_cfg");
  },
  async setCfg(c) { LS.set("pm_cfg", c); if (db) await db.doc("config/empresa").set(c); },
  async getLogo() {
    if (db) { try { const s = await db.doc("config/logo").get(); if (s.exists) return s.data().data || null; } catch {} }
    return LS.get("pm_logo");
  },
  async setLogo(d) {
    LS.set("pm_logo", d);
    if (db) { try { d ? await db.doc("config/logo").set({ data: d }) : await db.doc("config/logo").delete(); } catch { toast("El logo quedó guardado solo en este dispositivo."); } }
  },
  async list() {
    if (db) { try { const q = await db.collection("presupuestos").get(); return q.docs.map(d => d.data()); } catch {} }
    return Object.values(LS.get("pm_list") || {});
  },
  async save(p) {
    const all = LS.get("pm_list") || {}; all[p.id] = p; LS.set("pm_list", all);
    if (db) await db.doc("presupuestos/" + p.id).set(p);
  },
  async del(id) {
    const all = LS.get("pm_list") || {}; delete all[id]; LS.set("pm_list", all);
    if (db) await db.doc("presupuestos/" + id).delete();
  }
};

/* ---------- estado del presupuesto ---------- */
const nuevoItem = (producto = "") => ({ detalle: "", producto, cantidad: 1, importe: "" });
const nuevoGrupo = () => ({ nombre: "", material: "", items: [nuevoItem()], totalEscrito: null });
function presupuestoVacio() {
  return { id: null, numero: cfg.proximo, fecha: hoyISO(), moneda: "US$", trabajo: "", cliente: "", telefono: "", nota: cfg.nota, grupos: [nuevoGrupo()] };
}
let P, dirty = false;
const subtotal = g => g.items.reduce((a, it) => a + num(it.importe), 0);
const totalP = p => p.grupos.reduce((a, g) => a + subtotal(g), 0);
const tieneContenido = p => p.grupos.some(g => g.nombre || g.items.some(it => it.detalle || num(it.importe)));

/* ---------- editor ---------- */
const metaCampos = ["numero", "fecha", "moneda", "trabajo", "cliente", "telefono", "nota"];
function pintarMeta() { metaCampos.forEach(k => $("#m-" + k).value = P[k] ?? ""); }
metaCampos.forEach(k => $("#m-" + k).addEventListener("input", e => {
  P[k] = k === "numero" ? parseInt(e.target.value) || "" : e.target.value; dirty = true; actualizarTotales();
}));

function pintarGrupos() {
  $("#grupos").innerHTML = P.grupos.map((g, gi) => `
    <article class="grupo" data-g="${gi}">
      <div class="g-head">
        <input class="g-nombre" data-g="${gi}" data-f="nombre" value="${esc(g.nombre)}" placeholder="Pieza o sector (ej. Lavatorio intermedio)" aria-label="Nombre del grupo">
        <input class="g-mat" data-g="${gi}" data-f="material" value="${esc(g.material)}" placeholder="Material (ej. Granito Negro Brasil)" aria-label="Material del grupo">
        <button class="x" data-act="delG" data-g="${gi}" title="Quitar grupo" aria-label="Quitar grupo">×</button>
      </div>
      <div class="cols"><span>Medida o detalle</span><span>Material</span><span style="text-align:right">Cant.</span><span style="text-align:right">Importe</span><span></span></div>
      ${g.items.map((it, ii) => `
        <div class="it">
          <input data-g="${gi}" data-i="${ii}" data-f="detalle" value="${esc(it.detalle)}" placeholder="Ej. 145 x 50 · Zócalos 245 ml · Traforo" aria-label="Detalle">
          <input data-g="${gi}" data-i="${ii}" data-f="producto" value="${esc(it.producto)}" placeholder="Material (opcional)" aria-label="Material">
          <input data-g="${gi}" data-i="${ii}" data-f="cantidad" value="${esc(it.cantidad)}" type="number" inputmode="decimal" step="any" aria-label="Cantidad">
          <input data-g="${gi}" data-i="${ii}" data-f="importe" value="${esc(it.importe)}" type="number" inputmode="decimal" step="any" placeholder="0" aria-label="Importe">
          <button class="x" data-act="delI" data-g="${gi}" data-i="${ii}" title="Quitar ítem" aria-label="Quitar ítem">×</button>
        </div>`).join("")}
      <div class="g-foot">
        <button class="btn ghost" data-act="addI" data-g="${gi}">+ Agregar ítem</button>
        <span class="sub" data-sub="${gi}"></span>
      </div>
      <p class="warn" data-warn="${gi}" hidden></p>
    </article>`).join("");
  actualizarTotales();
}

function actualizarTotales() {
  const mon = P.moneda === "$" ? "$" : "US$";
  P.grupos.forEach((g, gi) => {
    const s = subtotal(g);
    const el = document.querySelector(`[data-sub="${gi}"]`); if (el) el.textContent = `Subtotal ${mon} ${fmt(s)}`;
    const w = document.querySelector(`[data-warn="${gi}"]`);
    if (w) {
      const te = g.totalEscrito;
      if (te != null && Math.abs(te - s) > 0.009) { w.hidden = false; w.innerHTML = `En la hoja el total dice ${mon} ${fmt(te)}, pero los ítems suman ${mon} ${fmt(s)}. <button class="btn ghost" data-act="ajustar" data-g="${gi}" style="color:inherit;text-decoration:underline">Usar el total escrito</button>`; }
      else w.hidden = true;
    }
  });
  $("#total").textContent = `${mon} ${fmt(totalP(P))}`;
}

$("#grupos").addEventListener("input", e => {
  const t = e.target, gi = +t.dataset.g, f = t.dataset.f; if (isNaN(gi) || !f) return;
  const g = P.grupos[gi]; dirty = true;
  if (t.dataset.i != null) { g.items[+t.dataset.i][f] = t.value; }
  else if (f === "material") {
    const viejo = g.material; g.material = t.value;
    g.items.forEach((it, ii) => { if (it.producto === viejo) { it.producto = t.value; const inp = document.querySelector(`[data-g="${gi}"][data-i="${ii}"][data-f="producto"]`); if (inp) inp.value = t.value; } });
  } else g[f] = t.value;
  actualizarTotales();
});
$("#grupos").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const gi = +b.dataset.g, g = P.grupos[gi]; dirty = true;
  if (b.dataset.act === "addI") { g.items.push(nuevoItem(g.material)); pintarGrupos(); document.querySelector(`[data-g="${gi}"][data-i="${g.items.length - 1}"][data-f="detalle"]`)?.focus(); }
  if (b.dataset.act === "delI") { g.items.splice(+b.dataset.i, 1); if (!g.items.length) g.items.push(nuevoItem(g.material)); pintarGrupos(); }
  if (b.dataset.act === "ajustar") {
    const d = Math.round((g.totalEscrito - subtotal(g)) * 100) / 100;
    g.items.push({ detalle: d < 0 ? "Bonificación" : "Ajuste", producto: "", cantidad: "", importe: d }); pintarGrupos();
  }
  if (b.dataset.act === "delG") {
    if (tieneContenido({ grupos: [g] }) && !confirm(`¿Quitar el grupo "${g.nombre || "sin nombre"}"?`)) return;
    P.grupos.splice(gi, 1); if (!P.grupos.length) P.grupos.push(nuevoGrupo()); pintarGrupos();
  }
});
$("#addG").onclick = () => { P.grupos.push(nuevoGrupo()); dirty = true; pintarGrupos(); document.querySelector(`[data-g="${P.grupos.length - 1}"][data-f="nombre"]`)?.focus(); };

function cargar(p) { P = JSON.parse(JSON.stringify(p)); dirty = false; pintarMeta(); pintarGrupos(); }

$("#nuevo").onclick = () => {
  if (dirty && tieneContenido(P) && !confirm("Hay cambios sin guardar. ¿Empezar uno nuevo igual?")) return;
  cargar(presupuestoVacio()); limpiarFotos(); vista("editor"); scrollTo(0, 0);
};

async function guardar(silencioso) {
  if (!P.numero) { toast("Poné un número de presupuesto."); return false; }
  if (!P.id) P.id = "p" + pad(P.numero) + "-" + Date.now().toString(36);
  P.total = totalP(P); P.actualizado = Date.now();
  try { await store.save(JSON.parse(JSON.stringify(P))); }
  catch { toast("No se pudo guardar en la nube; quedó en este dispositivo."); }
  if (P.numero >= cfg.proximo) { cfg.proximo = P.numero + 1; try { await store.setCfg(cfg); } catch {} $("#c-proximo").value = cfg.proximo; }
  dirty = false; if (!silencioso) toast(`Presupuesto N° ${pad(P.numero)} guardado.`);
  return true;
}
$("#guardar").onclick = () => guardar();

/* ---------- PDF ---------- */
function armarPDF(p) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const L = 10, R = 200, NAVY = [27, 53, 86], mon = p.moneda === "$" ? "$" : "US$";
  const PX = 67, C_COD = [67, 100], C_CANT = [168, 181];

  // Encabezado
  if (logo) {
    try { const pr = doc.getImageProperties(logo); let w = 58, h = w * pr.height / pr.width; if (h > 22) { h = 22; w = h * pr.width / pr.height; } doc.addImage(logo, L + 8, 8, w, h); }
    catch { logoTexto(); }
  } else logoTexto();
  function logoTexto() { doc.setFont("helvetica", "bolditalic"); doc.setFontSize(22); doc.setTextColor(...NAVY); doc.text(cfg.empresa || "", L + 8, 24); }
  doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(35);
  doc.text(doc.splitTextToSize(cfg.lema || "", 85), 76, 15);

  doc.setFillColor(...NAVY); doc.rect(L, 33, R - L, 8, "F");
  doc.setTextColor(255); doc.setFont("helvetica", "bold"); doc.setFontSize(13);
  doc.text(cfg.rubro || "", L + 22, 38.8);
  doc.setFontSize(14); doc.text("Tel : " + (cfg.telefono || ""), R - 2, 39, { align: "right" });

  doc.setTextColor(30); doc.setFontSize(8); doc.setFont("helvetica", "bold");
  doc.text(fechaCorta(p.fecha), L + 14, 46.5);
  doc.setFont("helvetica", "normal"); doc.text("N° presupuesto : " + pad(p.numero), L + 32, 46.5);
  doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(...NAVY);
  doc.text(doc.splitTextToSize("Trabajo : " + (p.trabajo || p.cliente || ""), 95)[0], 100, 47);

  // Panel
  let y = 50;
  function fondo(y0, h) {
    doc.setFillColor(218, 218, 218); doc.rect(PX, y0, R - PX, h, "F");
    doc.setFillColor(191, 191, 191); doc.rect(C_COD[0], y0, C_COD[1] - C_COD[0], h, "F"); doc.rect(C_CANT[0], y0, C_CANT[1] - C_CANT[0], h, "F");
  }
  function cabecera() {
    fondo(y, 13);
    doc.setFillColor(218, 218, 218); doc.rect(PX, y, R - PX, 7, "F");
    doc.setTextColor(20); doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.text("Presupuesto", 133.5, y + 5.6, { align: "center" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(6.5); doc.setTextColor(110);
    doc.text("Código", 83.5, y + 11, { align: "center" }); doc.text("Detalle", 114, y + 11, { align: "center" });
    doc.text("Producto", 148, y + 11, { align: "center" }); doc.text("Cantidad", 174.5, y + 11, { align: "center" });
    y += 13;
  }
  cabecera();

  // Columna izquierda
  const partes = (cfg.descripcion || "").split("\n");
  let ly = 64; doc.setTextColor(25);
  doc.setFont("helvetica", "bold"); doc.setFontSize(6.6);
  const tit = doc.splitTextToSize(partes[0] || "", 54); doc.text(tit, L + 2, ly); ly += tit.length * 2.9 + 2.5;
  doc.setFont("helvetica", "normal"); doc.setFontSize(5.8);
  partes.slice(1).forEach(l => { const t = doc.splitTextToSize(l, 54); doc.text(t, L + 2, ly); ly += t.length * 2.5; });

  const LH = 3.9, LIM = 262;
  function saltar(h) { if (y + h > LIM) { doc.addPage(); y = 14; cabecera(); } }

  p.grupos.forEach(g => {
    const items = g.items.filter(it => it.detalle || it.producto || num(it.importe));
    if (!items.length && !g.nombre) return;
    const cod = doc.splitTextToSize(g.nombre || "", 31);
    items.forEach((it, i) => {
      saltar(LH); fondo(y, LH);
      doc.setTextColor(20); doc.setFontSize(7);
      if (i === 0 && cod.length) { doc.setFont("helvetica", "bold"); doc.text(cod[0], C_COD[0] + 1.5, y + 2.8); }
      if (i > 0 && cod[i]) { doc.setFont("helvetica", "bold"); doc.text(cod[i], C_COD[0] + 1.5, y + 2.8); }
      doc.setFont("helvetica", "normal");
      doc.text(doc.splitTextToSize(it.detalle || "", 27)[0] || "", 114, y + 2.8, { align: "center" });
      doc.text(doc.splitTextToSize(it.producto || "", 39)[0] || "", 148, y + 2.8, { align: "center" });
      if (it.cantidad !== "" && it.cantidad != null) doc.text(fmt(num(it.cantidad)), 174.5, y + 2.8, { align: "center" });
      doc.setFontSize(8.5); doc.text("$ " + fmt(num(it.importe)), R - 3, y + 2.9, { align: "right" });
      y += LH;
    });
    saltar(6); fondo(y, 6);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(20);
    doc.text("$ " + fmt(subtotal(g)), R - 3, y + 4.5, { align: "right" });
    y += 6;
  });

  if (y < 226) { fondo(y, 226 - y); y = 226; }
  if (y + 30 > 290) { doc.addPage(); y = 20; }

  // Total
  doc.setFillColor(216, 228, 192); doc.rect(L, y, R - L, 16, "F");
  doc.setTextColor(20); doc.setFont("helvetica", "bold"); doc.setFontSize(10);
  doc.text(`Total ${mon}`, 158, y + 7, { align: "right" });
  doc.setTextColor(...NAVY); doc.setFontSize(18); doc.text("$ " + fmt(totalP(p)), R - 6, y + 8, { align: "right" });
  y += 16;
  doc.setFillColor(95, 95, 95); doc.rect(L, y, R - L, 3, "F");
  doc.setTextColor(255); doc.setFontSize(4.5); doc.setFont("helvetica", "bold"); doc.text(cfg.pie || "", L + 1, y + 2.1);
  y += 7;
  if (p.nota) { doc.setTextColor(20); doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.text(doc.splitTextToSize(p.nota, R - L), L, y); }
  return doc;
}
function bajar(blob, nombre) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const nombrePDF = p => `Presupuesto_${pad(p.numero)}.pdf`;

async function descargarPDF(p) {
  if (!window.jspdf) { toast("No se pudo cargar el generador de PDF. Revisá la conexión."); return false; }
  const blob = armarPDF(p).output("blob");
  if (!downloads) { bajar(blob, nombrePDF(p)); return true; }
  try { await downloads.save({ filename: nombrePDF(p), data: blob }); return true; }
  catch (e) { if (e?.code !== "declined") toast("No se pudo descargar el PDF."); return false; }
}
$("#pdf").onclick = async () => { if (!validar()) return; await guardar(true); await descargarPDF(P); };

function validar() {
  if (!tieneContenido(P)) { toast("Agregá al menos un ítem antes de generar el PDF."); return false; }
  return true;
}

/* ---------- WhatsApp ---------- */
function telWA(t) {
  let d = String(t || "").replace(/\D/g, "");
  if (!d) return "";
  if (d.startsWith("0")) d = d.slice(1);
  if (d.startsWith("54")) return d.startsWith("549") ? d : "549" + d.slice(2);
  if (d.length === 10) return "549" + d;
  return d;
}
$("#wa").onclick = async () => {
  if (!validar()) return;
  await guardar(true);
  const mon = P.moneda === "$" ? "$" : "US$";
  const texto = `Hola${P.cliente ? " " + P.cliente : ""}, te paso el presupuesto N° ${pad(P.numero)}${P.trabajo ? " (" + P.trabajo + ")" : ""}. Total ${mon} ${fmt(totalP(P))}.`;
  // 1) En el celular: compartir el PDF directo
  if (window.jspdf && navigator.canShare) {
    try {
      const file = new File([armarPDF(P).output("blob")], nombrePDF(P), { type: "application/pdf" });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: texto }); return; }
    } catch (e) { if (e?.name === "AbortError") return; }
  }
  // 2) Si no se puede: bajar el PDF y abrir el chat con el mensaje
  const ok = await descargarPDF(P);
  const tel = telWA(P.telefono);
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(texto)}`, "_blank", "noopener");
  if (ok) toast("Se descargó el PDF: adjuntalo en el chat que se abrió.", 5000);
};

function limpiarFotos() {}

/* ---------- guardados ---------- */
let cache = [];
async function pintarLista() {
  const cont = $("#lista"); cont.innerHTML = `<p class="empty">Cargando…</p>`;
  cache = (await store.list()).sort((a, b) => (b.numero || 0) - (a.numero || 0) || (b.actualizado || 0) - (a.actualizado || 0));
  filtrar();
}
function filtrar() {
  const q = $("#buscar").value.trim().toLowerCase();
  const rows = cache.filter(p => !q || [p.cliente, p.trabajo, pad(p.numero)].join(" ").toLowerCase().includes(q));
  $("#lista").innerHTML = rows.length ? rows.map(p => `
    <div class="card">
      <span class="num">${pad(p.numero)}</span>
      <div><div class="t">${esc(p.trabajo || "Sin título")}</div><div class="m">${esc(p.cliente || "")}${p.cliente ? " · " : ""}${fechaCorta(p.fecha)}</div></div>
      <span class="amt">${p.moneda === "$" ? "$" : "US$"} ${fmt(p.total ?? totalP(p))}</span>
      <div class="acts">
        <button class="btn ghost" data-l="abrir" data-id="${esc(p.id)}">Abrir</button>
        <button class="btn ghost" data-l="dup" data-id="${esc(p.id)}">Duplicar</button>
        <button class="btn ghost" data-l="pdf" data-id="${esc(p.id)}">PDF</button>
        <button class="btn ghost" data-l="del" data-id="${esc(p.id)}" style="color:var(--warn)">Borrar</button>
      </div>
    </div>`).join("") : `<p class="empty">${q ? "No hay presupuestos que coincidan." : "Todavía no guardaste presupuestos. Armá uno y tocá Guardar."}</p>`;
}
$("#buscar").oninput = filtrar;
$("#lista").onclick = async e => {
  const b = e.target.closest("[data-l]"); if (!b) return;
  const p = cache.find(x => x.id === b.dataset.id); if (!p) return;
  const a = b.dataset.l;
  if (a === "abrir" || a === "dup") {
    if (dirty && tieneContenido(P) && !confirm("Hay cambios sin guardar en el presupuesto abierto. ¿Seguir igual?")) return;
    const c = JSON.parse(JSON.stringify(p));
    if (a === "dup") { c.id = null; c.numero = cfg.proximo; c.fecha = hoyISO(); }
    cargar(c); if (a === "dup") dirty = true; vista("editor"); scrollTo(0, 0);
  }
  if (a === "pdf") descargarPDF(p);
  if (a === "del" && confirm(`¿Borrar el presupuesto N° ${pad(p.numero)}? No se puede deshacer.`)) {
    try { await store.del(p.id); } catch {} cache = cache.filter(x => x.id !== p.id); filtrar(); toast("Presupuesto borrado.");
  }
};

/* ---------- ajustes ---------- */
const cfgCampos = ["empresa", "rubro", "telefono", "proximo", "lema", "descripcion", "pie", "nota"];
function pintarCfg() {
  cfgCampos.forEach(k => $("#c-" + k).value = cfg[k] ?? "");
  $("#logoPrev").hidden = !logo; if (logo) $("#logoPrev").src = logo; $("#quitarLogo").hidden = !logo;
  $("#brandSub").textContent = cfg.empresa ? `${cfg.rubro || "Marmolería"} ${cfg.empresa}` : "Marmolería";
}
$("#guardarCfg").onclick = async () => {
  cfgCampos.forEach(k => cfg[k] = k === "proximo" ? parseInt($("#c-proximo").value) || 1 : $("#c-" + k).value);
  try { await store.setCfg(cfg); $("#cfgStatus").textContent = "Ajustes guardados."; }
  catch { $("#cfgStatus").textContent = "Guardado solo en este dispositivo."; }
  pintarCfg(); if (!P.id && !tieneContenido(P)) { P.numero = cfg.proximo; P.nota = cfg.nota; pintarMeta(); }
};
$("#c-logo").onchange = e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const img = new Image();
  img.onload = async () => {
    const k = Math.min(1, 600 / img.width), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    logo = c.toDataURL("image/png"); URL.revokeObjectURL(img.src);
    await store.setLogo(logo); pintarCfg(); toast("Logo actualizado.");
  };
  img.onerror = () => toast("No se pudo abrir esa imagen.");
  img.src = URL.createObjectURL(f);
};
$("#quitarLogo").onclick = async () => { logo = null; await store.setLogo(null); pintarCfg(); };

/* ---------- navegación ---------- */
function vista(v) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === v)));
  ["editor", "lista", "ajustes"].forEach(x => $("#v-" + x).hidden = x !== v);
  $("#bar").hidden = v !== "editor";
  if (v === "lista") pintarLista();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => vista(b.dataset.view));
window.addEventListener("beforeunload", e => { if (dirty && tieneContenido(P)) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- arranque ---------- */
(function inicio() {
  const c = LS.get("pm_cfg"); if (c) cfg = { ...CFG_DEF, ...c };
  logo = LS.get("pm_logo") || LOGO_DEF;
  cargar(presupuestoVacio()); pintarCfg();
})();

(async function capacidades() {
  if (!window.claude?.use) return;
  const [d, s, dl] = await Promise.all([
    claude.use("db").catch(() => null), claude.use("sample").catch(() => null), claude.use("downloads").catch(() => null)
  ]);
  downloads = dl;
  if (d) {
    db = d;
    const c = await store.getCfg(); if (c) cfg = { ...CFG_DEF, ...c };
    const lg = await store.getLogo(); if (lg) logo = lg;
    pintarCfg();
    if (!P.id && !tieneContenido(P)) { P.numero = cfg.proximo; P.nota = cfg.nota; pintarMeta(); }
    if (!$("#v-lista").hidden) pintarLista();
  }
})();
</script>
